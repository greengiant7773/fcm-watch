name: Update regulation feed

on:
  schedule:
    # 毎日 21:00 UTC = 日本時間 朝6:00 頃。規制フィードの収集のみ。
    - cron: "0 21 * * *"
    # 毎月28日 22:00 UTC = 日本時間 翌朝7:00 頃。月次まとめの下書きを作る。
    # 28日にしておけば、どの月でも必ず1回は当たる。
    - cron: "0 22 28 * *"
  workflow_dispatch:
    inputs:
      make_draft:
        description: "月次まとめの下書きも作る"
        type: boolean
        default: false
      month:
        description: "対象月（YYYY-MM、空なら今月）"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor script
        run: python monitor.py

      # 月次まとめの「下書き」を作る。公開はしない。
      # 規制の一次情報をそのまま出しても商品にならないので、
      # 人が「どの容器に効くか」を書き足してから手動で公開する。
      - name: Create monthly draft on note
        id: draft
        continue-on-error: true
        if: github.event.schedule == '0 22 28 * *' || inputs.make_draft
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
        run: python monthly_draft.py ${{ inputs.month }}

      - name: Commit and push if changed
        run: |
          git config user.name "fcm-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add updates.json drafted_months.json
          git diff --staged --quiet || git commit -m "chore: update regulation feed"
          git push

      # 下書き作成が失敗していたらジョブを赤くして通知を飛ばす。
      # Cookieの期限切れが最も多い原因。
      - name: Fail if draft creation failed
        if: steps.draft.outcome == 'failure'
        run: |
          echo "::error::noteの下書き作成に失敗しました。Cookieの期限切れが最も多い原因です。"
          exit 1
