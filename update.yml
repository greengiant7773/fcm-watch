name: Update regulation feed

on:
  schedule:
    # 毎日 21:00 UTC = 日本時間 朝6:00 頃に実行
    - cron: "0 21 * * *"
  workflow_dispatch: {}  # 手動実行ボタンも使えるようにしておく

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor script
        run: python monitor.py

      # 失敗しても後続のコミットは行う。
      # 成功した分の記録を残さないと次回二重投稿になるため。
      - name: Post new updates to note
        id: note
        continue-on-error: true
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
        run: python post_to_note.py

      - name: Commit and push if changed
        run: |
          git config user.name "fcm-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add updates.json posted_to_note.json
          git diff --staged --quiet || git commit -m "chore: update regulation feed"
          git push

      # note投稿が失敗していたらここでジョブを赤くする。
      # GitHubから失敗通知メールが届き、黙って止まるのを防ぐ。
      - name: Fail if note posting failed
        if: steps.note.outcome == 'failure'
        run: |
          echo "::error::noteへの投稿に失敗しました。"
          echo "セッションCookieの期限切れが最も多い原因です。"
          echo "ブラウザでnoteにログインし直し、_note_session_v5 の値を"
          echo "Secrets の NOTE_SESSION_COOKIE に再設定してください。"
          exit 1
